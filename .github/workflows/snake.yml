name: Serpiente de contribuciones

# Regenera cada día la animación de la serpiente sobre el gráfico de contribuciones
# y la publica en la rama `output`, desde donde la enlaza el README.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#4338ca&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4338ca
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3de0c0&color_dots=#161b22,#1e2a5a,#2d3fb0,#6d7cff,#3de0c0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
